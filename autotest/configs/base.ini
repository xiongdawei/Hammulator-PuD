[dram_structure]
protocol = DDR4
                    # 6+7 (cache line + shift bits)
bankgroups = 4      # 2
banks_per_group = 4 # 2
rows = 65536        # 16
columns = 1024      # 10
device_width = 8
BL = 8

[timing]
tCK = 0.83
AL = 0
CL = 17
CWL = 12
tRCD = 17
tRP = 17
tRAS = 39
tRFC = 420
tRFC2 = 312
tRFC4 = 192
# TODO: why do we need to increase that high?
# tREFI = 9360
tREFI = 93600000
tRPRE = 1
tWPRE = 1
tRRD_S = 4
tRRD_L = 6
tWTR_S = 3
tWTR_L = 9
tFAW = 26
tWR = 18
tWR2 = 19
tRTP = 9
tCCD_S = 4
tCCD_L = 6
tCKE = 6
tCKESR = 7
tXS = 432
tXP = 8
tRTRS = 1

[power]
VDD = 1.2
IDD0 = 48
IPP0 = 3.0
IDD2P = 25
IDD2N = 34
IDD3P = 37
IDD3N = 43
IDD4W = 123
IDD4R = 135
IDD5AB = 250
IDD6x = 30

[system]
channel_size = 16384
channels = 1
bus_width = 64
# address_mapping = rochrababgco
# address_mapping = chrababgroco
address_mapping = chrabarobgco
queue_structure = PER_BANK
refresh_policy = RANK_LEVEL_STAGGERED
row_buf_policy = OPEN_PAGE
cmd_queue_size = 8
# TODO: DRAMsim3 crashes when this is not increased.
# Increasing this is bad but the only option we currently have.
# But if we increase too much the memory consumption exploads.
trans_queue_size = 320000

[rowhammer]
# Number of hammers so that the first bit flips start to occur.
HC_first = 4000
# Number of hammers where no new flips occur anymore.
HC_last = 10000

# Spatial Variation 
spatial_variation_enabled = true
spatial_variation_seed = 1337
# HCfirst distribution relative to the most vulnerable row's HCfirst.
# 99%, 95%, and 90% of rows are at least these multipliers, respectively.
spatial_q01_multiplier = 1.6
spatial_q05_multiplier = 2.0
spatial_q10_multiplier = 2.2
# Upper tail for the least vulnerable rows.
spatial_q100_multiplier = 3.0


# From the PuDHammer paper, the weights for the SiMRA and CoMRA counters.
SiMRA_weight = 200
CoMRA_weight = 10

# Temperature assuing it's stable over the time 
temperature = 50
baseline_temperature = 50 
temperature_scale_facotr = 0.0667;

# tAggOn parameter for the PuDHammer attack, which is the time it takes for the SiMRA and CoMRA counters to decay by 1.
tRAS_baseline_ticks = 39
tAggOn = 39
tAggOn_max_ticks = 70200
simra_taggon_max_penalty = 270.0
normal_taggon_max_penalty = 3.0

# Probability that a quadword flips at HC_last
# this is modulated by the non-linear HC growth curve below
HC_last_bitflip_rate = 0.005
non_linear_degree = 3.0

inc_dist_1 = 1
inc_dist_2 = 0.3
inc_dist_3 = 0.1
inc_dist_4 = 0.0
inc_dist_5 = 0.0

# Probabilities that x flips in a quadword occur.
# Need to satisfy p1+p2+p3+p4=1.
proba_1_bit_flipped = 1.0
proba_2_bit_flipped = 0.0
proba_3_bit_flipped = 0.0
proba_4_bit_flipped = 0.0
# predefined static flip mask, overwrites probabilities above
# flip_mask = 0x10000

# Probability as reported by Kim et. al
para_proba = 0.001
para_enabled = false

# PRAC+ABO mitigation
prac_abo_enabled = false
prac_threshold = 100
prac_blast_radius = 2

# Threshold so that it is just below HC_first
trr_threshold = 3000
trr_enabled = false

# SALT / SALT-C (HPCA 2026)
# If salt_apm / salt_ath are omitted or set to 0, they are derived from
# salt_target_max_activations using the paper's MaxACT relation.
salt_enabled = false
salt_coord_refresh = false
salt_row_striping = true
salt_bundle_rows = 7
salt_rows_per_subarray = 512
salt_subarrays = 128
salt_target_max_activations = 3000
salt_apm = 39
salt_ath = 78
# ABO_LEVEL derates the per-refresh counter decay (APM/7/ABO_LEVEL); higher
# values mean slower decay and a more aggressive mitigation stance.
salt_abo_level = 1
# Number of subarrays whose counters are decayed (and get one row
# proactively refreshed) per refresh event. 0 derives subarrays/16.
salt_refspread = 0

[other]
epoch_period = 1204819
output_level = 1

[thermal]
loc_mapping = 33,33,32-31,30-29,26:13-27-28,12:3
power_epoch_period = 100000; power epoch period (# cycle)
chip_dim_x = 0.008; chip size in x dimension [m]
chip_dim_y = 0.008; chip size in y dimension [m]
amb_temp = 40; The ambient temperature in [C]
mat_dim_x = 512;
mat_dim_y = 512;
bank_order = 0; 0: x direction first, 1: y direction first
